<mat-card>
  <mat-card-header
    ><mat-card-title
      ><span class="confirm-title">{{ message.title }}</span></mat-card-title
    >
    <button
      id="modal-close-button"
      type="button"
      mat-mini-fab
      color="basic"
      aria-label="Cerrar"
      (click)="closeModal(false)"
    >
      <mat-icon>close</mat-icon>
    </button></mat-card-header
  >
  <mat-card-content>
    <p *ngFor="let line of bodyLines" class="body-line">
      <ng-container *ngFor="let segment of line"><strong *ngIf="segment.bold">{{ segment.text }}</strong><ng-container *ngIf="!segment.bold">{{ segment.text }}</ng-container></ng-container>
    </p>
  </mat-card-content>
  <mat-card-actions
    *ngIf="!hiddenActions"
  >
    <button
      type="button"
      mat-button
      (click)="closeModal(false)"
    >
      Cancelar
    </button>

    <button
      type="button"
      mat-flat-button
      color="warn"
      (click)="closeModal(true)"
    >
      Aceptar
    </button></mat-card-actions
  >
</mat-card>

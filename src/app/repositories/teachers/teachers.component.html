<div class="mat-container">
    <mat-card>
      <mat-card-header>
      </mat-card-header>
      <mat-card-content>
        <sigeit-table
          emptyMessage="No hay profesores para mostrar"
          (clickOption)="clickAction($event)"
        >
          <div filters class="filters-container">
            <mat-form-field>
              <mat-label>Departamento</mat-label>
              <mat-select [formControl]="departmentIdCtrl">
                <mat-option *ngFor="let department of departments" [value]="department.id">
                  {{department.name}}
                </mat-option>
              </mat-select>
            </mat-form-field>

            <mat-form-field>
              <mat-label>Estado</mat-label>
              <mat-select [formControl]="statusCtrl">
                <mat-option *ngFor="let status of statusOptions" [value]="status.value">
                  {{status.name}}
                </mat-option>
              </mat-select>
            </mat-form-field>

            <button
              mat-raised-button
              color="accent"
              (click)="generateList()"
              [disabled]="loading"
              class="btn-generate"
            >
              <mat-icon>file_download</mat-icon>
              Exportar Excel
            </button>
          </div>
        </sigeit-table>
      </mat-card-content>
    </mat-card>
    <button
      mat-fab
      matTooltip="Agregar profesor"
      color="primary"
      aria-label="Agregar profesor"
      class="btn-fixed"
      (click)="showModal()"
      [disabled]="loading"
    >
      <mat-icon>add</mat-icon>
    </button>
  </div>

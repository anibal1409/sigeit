<div class="mat-container">
  <mat-card>
    <mat-card-header>
    </mat-card-header>
    <mat-card-content>
      <sigeit-table
        emptyMessage="No hay formatos para mostrar"
        emptySearchMessage="Ningún formato coincide con la búsqueda"
        (clickOption)="clickAction($event)"
      >
        <mat-form-field filters *ngIf="!departmentIdUser">
          <mat-label>Departamento</mat-label>
          <mat-select [formControl]="departmentCtrl">
            <mat-option [value]="null">Todos</mat-option>
            <mat-option *ngFor="let department of departments" [value]="department.id">
              {{ department.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </sigeit-table>
    </mat-card-content>
  </mat-card>
  <button
    mat-fab
    matTooltip="Agregar formato"
    color="primary"
    aria-label="Agregar formato"
    class="btn-fixed"
    (click)="goToForm()"
  >
    <mat-icon>add</mat-icon>
  </button>
</div>

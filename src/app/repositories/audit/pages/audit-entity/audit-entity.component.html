<mat-card class="audit-entity">
  <mat-card-header>
    <mat-card-title>Historial — {{ titleResource() }} #{{ entityId }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p *ngIf="!records.length && !loading" class="empty">Sin registros para esta entidad.</p>
    <ol class="timeline" *ngIf="records.length">
      <li *ngFor="let row of records" class="timeline__item" (click)="openRecord(row)">
        <time>{{ formatDate(row.createdAt) }}</time>
        <strong>{{ actionLabel(row.action) }}</strong>
        <span>{{ row.userEmail || row.userId || '—' }}</span>
        <span [class.fail]="!row.success">{{ row.success ? 'OK' : row.statusCode }}</span>
      </li>
    </ol>
  </mat-card-content>
  <mat-card-actions>
    <button mat-button type="button" (click)="back()">Volver</button>
  </mat-card-actions>
</mat-card>
<app-state *ngIf="loading"></app-state>
